name: NXNative public-source iOS compile
on:
  workflow_dispatch:
    inputs:
      apple_terms_reviewed:
        description: 'I have reviewed and can comply with the applicable Apple toolchain terms'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-source-ios-check
  cancel-in-progress: false
jobs:
  compile:
    if: ${{ inputs.apple_terms_reviewed }}
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out orchestration only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out pinned public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zenvyzenshiro/NXNativeWindows
          ref: 269d61ff974b2e8e073d7357466ae130c3f6812f
          path: source
          persist-credentials: false
      - name: Compile public source and synthetic shader
        run: python3 scripts/run_checks.py --source source --logs logs
      - name: Return diagnostic logs only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-source-ios-check-logs
          path: |
            logs/*.log
            logs/results.json
          retention-days: 7
          if-no-files-found: warn
